<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StuCanvas Web-Archiver - 单文件自解密打包器</title>
    <!-- 引入独立的外部样式表 -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h3>StuCanvas Web-Archiver</h3>
        <p>本地 Wasm 编译器 · 支持多文件一键打包输出为“单网页自解密归档”</p>
        <p style="font-size: 0.75rem; color: var(--accent-primary); margin-top: 8px; opacity: 0.8; font-weight: 600;">By Friendships666</p>
    </div>

    <!-- 拖拽上传区域 (支持多选) -->
    <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" multiple>
        <div class="dropzone-icon">🎁</div>
        <div class="file-info" id="fileInfo">
            <div>将一个或多个源文件拖拽至此，或 <span style="color: var(--accent-primary); text-decoration: underline;">点击浏览文件</span></div>
            <div class="active-file" id="activeFile">未选择任何文件</div>
        </div>
    </div>

    <!-- 极客风进度条 -->
    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- 智能状态反馈栏 -->
    <div class="status-msg" id="statusMsg"></div>

    <!-- 归档包命名配置 -->
    <div class="input-group">
        <label for="archiveName">自定义网页文件名（可选）</label>
        <input type="text" id="archiveName" placeholder="不填写则默认以首个文件名命名">
    </div>

    <!-- 密码区域 -->
    <div class="input-group">
        <label for="password">安全解锁密码</label>
        <input type="password" id="password" placeholder="请输入将来用于解锁本归档的密码">
    </div>

    <!-- 防忘密码：复选框选项 -->
    <div class="checkbox-group">
        <input type="checkbox" id="includeKeyCheckbox">
        <label for="includeKeyCheckbox">将密码明文写入网页文件名中（防止忘记密码）</label>
    </div>

    <!-- 操作按钮 -->
    <div class="btn-group">
        <button class="btn-encrypt" id="encBtn">
            <span>🔒 一键打包生成自解密 HTML</span>
        </button>
    </div>

    <!-- [高级预览定位] 采用和解密端一模一样的 .preview-card 卡片列表呈现，比例不失真，高度受限不挤压 -->
    <div class="selected-files-container" id="selectedFilesContainer" style="margin-top: 25px;">
        <div class="selected-files-title">📁 待打包归档内的文件列表与即时预览：</div>
        <div id="selectedFilesList"></div>
    </div>
</div>

<!-- 原生 ES 模块脚本 -->
<script type="module" src="./index.js"></script>
</body>
</html>
