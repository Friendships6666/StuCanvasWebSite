<!doctype html>
<html lang="en" data-boot-state="loading" aria-busy="true">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>StuCanvas Lite</title>
  <meta name="theme-color" content="#3e1019" />
  <link rel="icon" href="/logo/official/pulsar-auto.svg" type="image/svg+xml" />
  <style id="startup-style">
    /* Resolve the saved light/dark mode before loading the application graph. */
    :root { --startup-background:#fffaf9; --startup-ink:#a6243b; --startup-muted:#80636a; --startup-metal:#a6243b; --startup-light:#d43952; }
    @media(prefers-color-scheme:dark) { :root:not([data-startup-tone]):not([data-color-scheme="light"]) { --startup-background:#0b0b0b; --startup-ink:#62f5eb; --startup-muted:#83aaa8; --startup-metal:#38bcb5; --startup-light:#8afff3; } }
    :root[data-startup-tone="dark"]:not([data-color-scheme="light"]), :root[data-color-scheme="dark"] { --startup-background:#0b0b0b; --startup-ink:#62f5eb; --startup-muted:#83aaa8; --startup-metal:#38bcb5; --startup-light:#8afff3; }
    #startup { position:fixed; inset:0; z-index:2147483647; display:grid; place-items:center; isolation:isolate; overflow:hidden; margin:0; background:var(--startup-background); color:var(--startup-ink); font-family:Arial,"Microsoft YaHei",sans-serif; }
    #startup::before { content:""; position:absolute; inset:0; z-index:-2; background:radial-gradient(ellipse at 50% 43%,color-mix(in srgb,var(--startup-light) 9%,transparent),transparent 45%),radial-gradient(ellipse at 22% 75%,color-mix(in srgb,var(--startup-ink) 5%,transparent),transparent 56%); }
    .startup-stars { position:absolute; inset:0; z-index:-1; width:100%; height:100%; color:var(--startup-muted); pointer-events:none; }
    .startup-stars-near { animation:startup-scintillation 7s ease-in-out infinite alternate; }
    .startup-content { display:grid; justify-items:center; gap:15px; max-width:100%; padding:24px; box-sizing:border-box; text-align:center; }
    .startup-instrument { position:relative; width:min(440px,84vw,57svh); aspect-ratio:1; margin-bottom:10px; }
    .startup-instrument::before { content:""; position:absolute; inset:20%; border-radius:50%; background:radial-gradient(circle,color-mix(in srgb,var(--startup-light) 8%,transparent),transparent 68%); }
    .startup-mechanism { position:absolute; inset:0; width:100%; height:100%; overflow:visible; fill:none; stroke:currentColor; stroke-width:.7; color:var(--startup-metal); }
    .startup-rotor { transform-origin:220px 220px; animation:startup-orbit var(--period) linear infinite; }
    .startup-reverse { animation-direction:reverse; }
    .startup-graduations { opacity:.6; }
    .startup-reference { opacity:.23; }
    .startup-orbital-plane { color:var(--startup-light); opacity:.46; }
    .startup-bearing { fill:var(--startup-background); stroke:var(--startup-metal); stroke-width:1; }
    .startup-logo { position:absolute; inset:23%; display:block; width:54%; height:54%; overflow:visible; color:var(--startup-ink); filter:drop-shadow(0 0 7px color-mix(in srgb,var(--startup-light) 24%,transparent)); }
    .startup-axis { transform-origin:108px 139px; animation:startup-orbit var(--period) linear infinite; }
    .startup-nucleus { position:absolute; left:50%; top:50%; width:5px; height:5px; margin:-2.5px; border-radius:50%; background:var(--startup-light); box-shadow:0 0 10px 2px color-mix(in srgb,var(--startup-light) 40%,transparent),0 0 30px color-mix(in srgb,var(--startup-light) 18%,transparent); animation:startup-core-pulse 2.4s ease-out infinite; }
    @keyframes startup-orbit { from { transform:rotate(var(--phase,0deg)); } to { transform:rotate(calc(var(--phase,0deg) + 360deg)); } }
    @keyframes startup-scintillation { from { opacity:.35; } to { opacity:.8; } }
    .startup-wordmark { margin:0; padding-left:.18em; font-size:20px; font-weight:400; letter-spacing:.18em; line-height:1.5; }
    .startup-wordmark span { display:block; margin-top:7px; padding-left:.4em; color:var(--startup-metal); font-size:9px; letter-spacing:.4em; }
    .startup-navigation { position:absolute; inset:0; z-index:-1; width:100%; height:100%; overflow:visible; pointer-events:none; fill:none; stroke:var(--startup-metal); stroke-width:.65; }
    .startup-ranging-line { opacity:.16; }
    .startup-ranging-pulse { stroke:var(--startup-light); stroke-width:1.15; stroke-dasharray:16 84; animation:startup-ranging 2.4s linear infinite; animation-delay:var(--delay); opacity:.6; }
    .startup-pulsar { color:var(--startup-light); }
    .startup-pulsar-wave { transform-box:fill-box; transform-origin:center; animation:startup-pulsar-wave 2.4s ease-out infinite; animation-delay:var(--delay); stroke:currentColor; }
    .startup-pulsar-beam { fill:currentColor; stroke:none; opacity:.26; }
    .startup-pulsar-rotor { transform-origin:0 0; animation:startup-orbit var(--period) linear infinite; }
    .startup-planetary { opacity:.65; }
    .startup-pinion { transform-origin:0 0; }
    .startup-iris { fill:color-mix(in srgb,var(--startup-metal) 5%,transparent); stroke-width:.6; opacity:.48; }
    .startup-status { display:none; align-items:center; justify-content:center; min-height:18px; color:var(--startup-muted); font-size:11px; line-height:1.6; letter-spacing:.04em; }
    @keyframes startup-ranging { from { stroke-dashoffset:0; } to { stroke-dashoffset:-100; } }
    @keyframes startup-pulsar-wave { from { transform:scale(.7); opacity:.65; } to { transform:scale(3); opacity:0; } }
    @keyframes startup-core-pulse { 0%,100% { opacity:.65; } 25% { opacity:1; } }
    [data-startup-failure] { display:none; }
    .startup-detail { max-width:min(320px,74vw); margin:0; font-size:12px; line-height:1.6; color:var(--startup-muted); }
    .startup-detail:empty { display:none; }
    .startup-retry { border:1px solid color-mix(in srgb,var(--startup-metal) 45%,transparent); border-radius:4px; padding:9px 24px; background:color-mix(in srgb,var(--startup-metal) 4%,transparent); color:var(--startup-ink); font:12px Arial,sans-serif; cursor:pointer; }
    .startup-retry:hover { background:color-mix(in srgb,var(--startup-metal) 9%,transparent); }
    .startup-retry:focus-visible { outline:2px solid var(--startup-light); outline-offset:4px; }
    #app-shell { visibility:hidden; }
    html[data-boot-state="revealing"] #app-shell, html[data-boot-state="ready"] #app-shell { visibility:visible; }
    html:is([data-boot-state="aligned"],[data-boot-state="revealing"]) .startup-graduations { opacity:.8; }
    html:is([data-boot-state="aligned"],[data-boot-state="revealing"]) #startup :is(.startup-rotor,.startup-pulsar-rotor) { animation:none; }
    html[data-boot-state="failed"] #startup :is(.startup-axis,.startup-rotor,.startup-stars-near,.startup-pulsar-wave,.startup-pulsar-rotor,.startup-ranging-pulse,.startup-nucleus) { animation:none; }
    html[data-boot-state="failed"] [data-startup-failure] { display:block; }
    html[data-boot-state="failed"] .startup-status { display:flex; }
    @media(max-height:540px) { .startup-content { gap:8px; padding:18px; } .startup-instrument { width:min(260px,46svh); margin-bottom:0; } .startup-wordmark { font-size:16px; } .startup-wordmark span { margin-top:2px; } }
    @media(prefers-reduced-motion:reduce) { #startup :is(.startup-axis,.startup-rotor,.startup-stars-near,.startup-pulsar-wave,.startup-pulsar-rotor,.startup-ranging-pulse,.startup-nucleus) { animation:none; } }
  </style>
  <script>
    (()=>{
      let dark=matchMedia('(prefers-color-scheme: dark)').matches;
      try{
        const saved=JSON.parse(localStorage.getItem('stucanvas.theme')||'null');
        const selection=saved?.selection;
        if(selection==='wine-light')dark=false;
        else if(selection==='cyan-dark')dark=true;
        else if(selection&&selection!=='system'){
          const theme=saved.themes?.find(theme=>theme.id===selection);
          if(theme?.mode)dark=theme.mode==='dark';
          else if(theme?.extends==='cyan-dark'||theme?.extends==='wine-light')dark=theme.extends==='cyan-dark';
        }
      }catch{}
      document.documentElement.dataset.startupTone=dark?'dark':'light';
    })();
  </script>

            <rect x="3.5" y="3.5" width="13" height="13" rx="4" />
            <path d="m16 16 4.5 4.5M7 10h6m-3-3v6" />
          </svg>
        </button>
        <button id="zoom-out" type="button" data-i18n-title="ui.zoomOut" data-i18n-aria-label="ui.zoomOut">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3.5" y="3.5" width="13" height="13" rx="4" />
            <path d="m16 16 4.5 4.5M7 10h6" />
          </svg>
        </button>
        <button id="fullscreen" type="button" data-i18n-title="ui.fullscreen" data-i18n-aria-label="ui.fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M14 4h6v6m0-6-6 6M4 14v6h6m-6 0 6-6M4 8V4h4m8 16h4v-4" />
          </svg>
        </button>
      </div>
      <div id="hint" class="hint" role="status" aria-live="polite"></div>
    </section>
  </main>
  <dialog id="ratio-dialog" class="ratio-dialog" aria-labelledby="ratio-title" aria-describedby="ratio-help">
    <form id="ratio-form" novalidate>
      <h2 id="ratio-title" data-i18n="tool.ratioPoint"></h2>
      <p id="ratio-help"></p>
      <div class="ratio-inputs">
        <label><span data-i18n="ratio.first"></span><input id="ratio-first" type="number" step="any" min="0" required value="1" aria-describedby="ratio-error" /></label>
        <span aria-hidden="true">:</span>
        <label><span data-i18n="ratio.second"></span><input id="ratio-second" type="number" step="any" min="0" required value="1" aria-describedby="ratio-error" /></label>
      </div>
      <p id="ratio-error" class="formula-error" role="alert"></p>
      <div class="ratio-actions">
        <button id="ratio-cancel" type="button" data-i18n="ratio.cancel"></button>
        <button id="ratio-create" type="submit" data-i18n="ratio.create"></button>
      </div>
    </form>
  </dialog>
  </div>
  <script src="/node_modules/matter-js/build/matter.min.js" defer data-startup-required onerror="document.documentElement.dataset.bootState='failed'"></script>
  <script type="module" src="/src/start.js" data-startup-required onerror="document.documentElement.dataset.bootState='failed'"></script>
</body>
